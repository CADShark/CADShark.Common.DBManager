name: CI

on:
  push:
    branches:
      - master
      - agent/**
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore CADShark.OpenManage.Client.sln

      - name: Build
        run: >
          dotnet build CADShark.OpenManage.Client.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test CADShark.OpenManage.Client.sln
          --configuration Release
          --no-build
          --verbosity normal
