name: OpenVault integration smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-and-read-object:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run OpenVault smoke test
        run: >
          dotnet run
          --configuration Release
          --project tests/OpenManage.Client.Integration/OpenManage.Client.Integration.csproj
